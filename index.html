<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e2034">
  <meta name="description" content="高校360°スクールツアーの3地点試作サイト。">
  <title>360°スクールツアー｜試作版</title>
  <!-- Pannellum 2.5.7 pinned CDN in prototype; see README for self-hosting. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
  <link rel="stylesheet" href="./css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <div class="layout">
    <header class="site-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">360°</div>
        <div><div class="brand-top">VIRTUAL CAMPUS TOUR <span class="prototype-tag">試作版</span></div><div class="brand-name">スクールツアー</div></div>
      </div>
      <button type="button" id="menu-toggle" class="top-button" aria-controls="scene-panel" aria-expanded="false"><span class="button-glyph" aria-hidden="true">☷</span> 地点一覧</button>
    </header>
    <main class="viewer-section" id="main">
      <div id="panorama" aria-label="360度パノラマビューア。マウスやタッチで方向を変更できます。"></div>
      <div id="intro-message" class="intro-message" aria-hidden="true"><div class="intro-compass">✦</div><div>自由に見渡せる学校案内</div><small>画像上の移動マーカーを選択してください</small></div>
      <div class="viewer-corner"><span class="tiny-pulse"></span> 360° PANORAMA</div>
      <div id="loading-status" class="loading-status" role="status" aria-live="polite" aria-busy="true">設定を読み込んでいます…</div>
      <div id="error-banner" class="error-banner" role="alert" hidden><span id="error-text"></span><button id="retry-button" type="button">再読み込み</button></div>
      <section class="information-card" aria-labelledby="scene-name">
        <div class="scene-indicator" id="scene-caption">試作データ</div>
        <h1 id="scene-name">360°スクールツアー</h1>
        <p id="scene-description">読み込み中です。</p>
        <div id="scene-links" class="quick-links" aria-label="この地点から移動"></div>
        <div id="scene-media" class="scene-media" hidden></div>
      </section>
      <div class="view-hint">ドラッグ・スワイプで360°見渡せます</div>
    </main>
    <aside id="scene-panel" class="scene-panel" aria-label="撮影地点一覧" hidden>
      <div class="panel-heading"><div><small>EXPLORE</small><h2>撮影地点一覧</h2></div><button type="button" id="close-panel" class="close-button" aria-label="地点一覧を閉じる">✕</button></div>
      <p>行きたい場所を選ぶと、その地点へ直接移動できます。</p>
      <nav id="scene-list" class="scene-list" aria-label="地点を選択"></nav>
      <div class="panel-foot">デモ画像は実際の学校施設ではありません。</div>
    </aside>
  </div>
  <noscript><p>このスクールツアーはJavaScriptを使用します。JavaScriptを有効にしてください。</p></noscript>
</body>
</html>
